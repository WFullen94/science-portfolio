# CV survey #1 — deepfake / synthetic-face detection. Single source of truth.

project_name: dfdetect

# --- Dataset -------------------------------------------------------------------
# pujanpaudel/deepfake_face_classification (HF Hub, CC BY-NC 4.0, not gated) — derived
# from DF40 (40 distinct real deepfake generation techniques), balanced real/fake.
# We deliberately use ONLY val.zip + test.zip (6,424 images, ~1.47GB) and skip
# train.rar (3.9GB, RAR format — an extra system dependency) — see README for the
# rationale. val.zip becomes our working train/val pool; test.zip is held out
# untouched as the true test set (never seen during training or model selection).
dataset:
  name: deepfake_face_classification (HF, subset)
  license: CC BY-NC 4.0 — non-commercial
  base_url: https://huggingface.co/datasets/pujanpaudel/deepfake_face_classification/resolve/main
  # These become our train/val pool (re-split 80/20 below).
  pool_zip: val.zip
  # This is the untouched held-out test set.
  test_zip: test.zip
  raw_dir: data/raw
  # Cap for tractability + a tiny bundled sample for CI (never needs the real download).
  max_per_class: null        # null = use everything in the pool
  sample_per_class: 4        # tiny CI/smoke sample

split:
  val_fraction: 0.2          # carved from the pool (val.zip), stratified
  random_state: 42

# --- Model: fine-tune a pretrained CNN as a binary classifier -----------------
# resnet50, not the initial efficientnet_b0 pick: the architecture head-to-head
# (compare.py) found all 4 fine-tuned CNNs statistically tied on CLEAN accuracy
# (0.994-0.996 ROC-AUC), but the robustness eval (robustness_eval.py) found resnet50
# far more robust to real-world degradation (noise, blur, downscale) than the others
# -- notably efficientnet_b0's own clean-AUC "win" crashes under noise (0.999->0.904)
# while resnet50 barely moves (0.9999->0.998). Robustness, not clean AUC, is what
# should drive the SERVED model -- see README for the full table.
model:
  backbone: resnet50           # torchvision, ImageNet-pretrained. See BACKBONES in
                                # modeling.py for the other 3 fine-tuned alternatives.
  img_size: 224
  device: null                 # null -> auto (mps > cuda > cpu)

train:
  epochs: 6
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 1.0e-4
  freeze_backbone_epochs: 1    # warm up the new head before unfreezing the backbone
  patience: 3                  # early stop on val AUC
  random_state: 42
  ckpt_dir: data/ckpt

eval:
  threshold: 0.5

# --- Serving ---------------------------------------------------------------
serve:
  onnx: data/dfdetect.onnx

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: dfdetect
