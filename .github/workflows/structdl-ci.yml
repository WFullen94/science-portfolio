name: Structured-DL CI

on:
  push:
    paths: ['project-8-structured-dl/**', '.github/workflows/structdl-ci.yml']
  pull_request:
    paths: ['project-8-structured-dl/**', '.github/workflows/structdl-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: project-8-structured-dl

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project-8-structured-dl/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .

      # Data-integrity tests run on the synthetic fallback (no network) and
      # model-shape tests do cheap CPU forward passes — no training, no dataset.
      - name: Run tests
        run: pytest -q
