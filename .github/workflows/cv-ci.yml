name: CV (Overwatch) CI

on:
  push:
    paths: ['project-7-cv/**', '.github/workflows/cv-ci.yml']
  pull_request:
    paths: ['project-7-cv/**', '.github/workflows/cv-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: project-7-cv

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The mAP@50 metric tests are pure numpy — no torch/ultralytics or the 1.6GB
      # VisDrone tree needed. Install a minimal set so CI is fast and reliable; the
      # model / eval / serve paths are verified locally.
      - name: Install (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml pytest
          pip install -e . --no-deps

      - name: Run metric tests
        run: pytest -q
