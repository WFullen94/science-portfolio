name: CV Survey — Deepfake Detection CI

on:
  push:
    paths: ['project-cv-deepfake/**', '.github/workflows/cv-deepfake-ci.yml']
  pull_request:
    paths: ['project-cv-deepfake/**', '.github/workflows/cv-deepfake-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: project-cv-deepfake

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Split/leakage-logic tests are pure — no torch/torchvision or the real ~1.5GB
      # dataset download needed. Install a minimal set so CI is fast; model
      # training/eval/serving verified locally.
      - name: Install (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest numpy pillow requests
          pip install -e . --no-deps

      - name: Run tests
        run: pytest -q
