name: LoRA CI

on:
  push:
    paths: ['project-6-lora/**', '.github/workflows/lora-ci.yml']
  pull_request:
    paths: ['project-6-lora/**', '.github/workflows/lora-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: project-6-lora

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project-6-lora/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .

      # Dataset-construction tests (STIX fixture parsing). The inference test
      # skips cleanly when no trained adapter is present.
      - name: Run tests
        run: pytest -q
